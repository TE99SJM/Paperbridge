name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source, browser, and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and mocked-protocol tests
        run: npm test

      - name: Build extension, helper, and fictional fixtures
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run test:browser

      - name: Check known dependency vulnerabilities
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Package both downloads
        run: |
          npm run package
          npm run package:local

      - name: Verify extracted production packages
        run: |
          npm run verify:release
          npm run verify:local

      - name: Retain verified build downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paperbridge-verified-downloads
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
