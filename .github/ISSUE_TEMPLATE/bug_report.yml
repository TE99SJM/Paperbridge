name: Bug report
description: Report a reproducible problem without sharing personal application data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use fictional data and redact screenshots, logs, page URLs, and file paths.
        Do not include resumes, account details, API keys, pairing codes, vault passphrases, or helper sessions.
        For a security vulnerability, use the repository's private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: Paperbridge version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser version and operating system
      placeholder: "Opera GX version, Windows/macOS/Linux version"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Personal-install release ZIP
        - Full project release ZIP
        - Built from a Git checkout or source ZIP
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: AI connection mode
      options:
        - AI chat website
        - Your provider API
        - ChatGPT account helper
        - No AI connection involved
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a fictional example rather than a real application or resume.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error text if available, with personal information removed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information, credentials, pairing codes, and session files from this report.
          required: true
